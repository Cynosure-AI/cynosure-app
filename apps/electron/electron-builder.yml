appId: com.openagent.desktop
productName: OpenAgent
copyright: Copyright © 2024-2026 OpenAgent

directories:
  buildResources: build
  output: release

files:
  - out/**/*

# Bundle the pre-built server and web alongside the app
extraResources:
  - from: ../server/dist
    to: server/dist
    filter: "**/*"
  - from: ../server/node_modules
    to: server/node_modules
    filter:
      - "**/*"
      - "!**/tsx/**"
      - "!**/@esbuild/**"
      - "!**/esbuild/**"
  - from: ../server/package.json
    to: server/package.json
  - from: ../web/dist
    to: web/dist
    filter: "**/*"

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png

mac:
  target: dmg
  icon: build/icon.icns

win:
  target: nsis
  icon: build/icon.ico
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
