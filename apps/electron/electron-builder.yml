appId: com.cynosure.desktop
productName: Cynosure
copyright: Copyright © 2024-2026 Cynosure

directories:
  buildResources: build
  output: release

# electron-builder writes app-update.yml into the packaged app and generates
# latest.yml/latest-linux.yml beside the installers. The generic provider is
# hosted manually; upload the metadata and artifacts together.
publish:
  provider: generic
  url: https://cometcms.banjocomet.com/media/cynosure/

files:
  - out/**/*

# The app's own dependencies have no native modules, and the bundled server's
# are N-API prebuilds (see scripts/prepare-server-deps.mjs) — nothing to rebuild.
npmRebuild: false

# Bundle the pre-built server and web alongside the app
# Server node_modules comes from .server-deps/ (flat, no pnpm symlinks)
extraResources:
  - from: ../server/dist
    to: server/dist
    filter: "**/*"
  # @huggingface/transformers + ONNX runtime (~840 MB, mostly CUDA providers)
  # are optional deps of @lancedb/lancedb, imported lazily only by its local
  # embedding helper. The server computes embeddings via providers instead.
  - from: .server-deps/node_modules
    to: server/node_modules
    filter:
      - "**/*"
      - "!@huggingface/transformers/**"
      - "!onnxruntime-node/**"
      - "!onnxruntime-web/**"
      - "!onnxruntime-common/**"
  - from: ../server/package.json
    to: server/package.json
  - from: ../web/dist
    to: web/dist
    filter: "**/*"

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  syncDesktopName: true

mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns

win:
  target: nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
