<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cynosure</title>
    <script>
      // Apply theme before Vue mounts to prevent flash of unstyled content.
      // Mirrors the default set in preferences.store.ts (SK_THEME = 'cy-theme', default 'dark').
      try {
        document.documentElement.dataset.theme = localStorage.getItem('cy-theme') || 'dark'
      } catch (_) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
