packages:
  - "apps/*"
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: false
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  vue-demi: true
overrides:
  # officeparser makes OCR mandatory; replace that unused runtime with a tiny disabled module.
  "officeparser>tesseract.js": link:./vendor/tesseract-disabled
