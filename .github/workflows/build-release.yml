name: Build & Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

jobs:
  # ── Linux Build ──────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package (Linux)
        run: pnpm package:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            apps/electron/release/*.AppImage
            apps/electron/release/*.deb
          if-no-files-found: error
          retention-days: 1 # Automatically deletes after 24 hours

  # ── Windows Build ────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package (Windows)
        run: pnpm package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          # Only the installer — exclude .blockmap (auto-update delta files)
          path: apps/electron/release/*.exe
          if-no-files-found: error
          retention-days: 1 # Automatically deletes after 24 hours

  # ── Draft Release ────────────────────────────────────────────────────────────
  draft-release:
    name: Draft Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: Cynosure ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/**/*
