name: Chat refactor validation
on:
  push:
    branches:
      - refactor/chat-transcript-contract

concurrency:
  group: chat-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:typecheck
      - run: pnpm --filter cynosure-server exec vitest run src/core/chat/transcript.test.ts src/core/chat/chat-events.test.ts src/db/migrations.test.ts
      - run: pnpm --filter cynosure-web test
      - run: pnpm build
