name: Chat refactor validation
on:
  push:
    branches:
      - refactor/chat-transcript-contract

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:typecheck
      - run: pnpm --filter cynosure-server test:unit
      - run: pnpm --filter cynosure-web test
      - run: pnpm build
