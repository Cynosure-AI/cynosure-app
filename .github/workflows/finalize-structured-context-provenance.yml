name: Finalize structured context provenance refactor

on:
  push:
    branches:
      - feat/structured-context-provenance

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/structured-context-provenance
          fetch-depth: 0

      - name: Apply refactor and test contract update
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/retry-structured-context-provenance.yml')
          lines = source_path.read_text().splitlines()
          start = lines.index("          python <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(script, str(source_path), 'exec'))

          p = Path('apps/server/src/core/agent/pre-execution/execution-memory.test.ts')
          text = p.read_text()
          text = text.replace(
              "    apply: vi.fn(),\n    skipped: vi.fn(),",
              "    apply: vi.fn(),\n    applyWithEvidence: vi.fn(),\n    skipped: vi.fn(),"
          )
          text = text.replace(
              "    applyAutoMemoryRouting: routingMocks.apply,\n    emitAutoMemoryRoutingSkipped:",
              "    applyAutoMemoryRouting: routingMocks.apply,\n    applyAutoMemoryRoutingWithEvidence: routingMocks.applyWithEvidence,\n    emitAutoMemoryRoutingSkipped:"
          )
          text = text.replace(
              "        routingMocks.apply.mockResolvedValue('## Relevant Knowledge\\n- Remembered deployment detail.')",
              "        routingMocks.applyWithEvidence.mockResolvedValue({\n            content: '## Relevant Knowledge\\n- Remembered deployment detail.',\n            evidence: [],\n        })"
          )
          text = text.replace(
              "        expect(routingMocks.apply).toHaveBeenCalledWith(expect.objectContaining({",
              "        expect(routingMocks.applyWithEvidence).toHaveBeenCalledWith(expect.objectContaining({"
          )
          p.write_text(text)

          Path('.github/workflows/finalize-structured-context-provenance.yml').unlink()
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm test:typecheck

      - name: Run provenance-adjacent tests
        run: pnpm --filter cynosure-server exec vitest run src/core/agent/pre-execution/auto-memory-routing.test.ts src/core/agent/pre-execution/execution-memory.test.ts

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: preserve structured context provenance"
          git push origin HEAD:feat/structured-context-provenance
